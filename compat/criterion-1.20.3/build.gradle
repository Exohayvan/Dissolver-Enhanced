plugins {
    id 'net.minecraftforge.gradle' version '6.0.53'
}

group = 'net.exohayvan.dissolver_enhanced.compat'
version = '1.20.3'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.3'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.3-49.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveBaseName = 'dissolver-criterion-compat-1.20.3'
}
