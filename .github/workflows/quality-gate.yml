name: Quality Gate

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  duplicate-code:
    name: Duplicate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install jscpd
        run: npm install --global jscpd@5.0.12

      - name: Scan entire branch for duplicate code
        uses: kucherenko/jscpd@v5.0.12
        with:
          skip-install: true
          path: .
          threshold: 0
          min-lines: 8
          min-tokens: 60
          reporters: console
          upload-sarif: false
          ignore: >-
            **/.git/**,
            **/node_modules/**,
            **/.venv/**,
            **/vendor/**,
            **/dist/**,
            **/build/**,
            **/coverage/**,
            **/generated/**